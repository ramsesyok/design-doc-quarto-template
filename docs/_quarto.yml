# ============================================================
#  設計書 book プロジェクト（Quarto → PDF / Typst）
#
#  1ファイル = 1章。章の中をさらに節・項に割るときは {{< include >}} を使う。
#  400〜1000ページ級の設計書を想定し、HTML は章ごとの別ページに分割して出す
#  （単一 HTML は図の base64 内包で数十 MB になり実用に耐えないため）。
#  PDF は従来どおり1ファイルで、章番号・図表番号・相互参照は章をまたいで連続する。
#
#  様式・変換・ビルドの実体はリポジトリ直下の ../template/ にある（執筆者は触らない）。
#  このフォルダ（既定名 docs）は執筆者が自由に改名してよい。ビルドはルートから
#  `./template/build-qmd.sh <このフォルダ名>` で呼ぶ（詳細は ../template/PIPELINE.md）。
#
#  注意（book 特有の落とし穴。詳細は ../template/PIPELINE.md）:
#   - include のパスは「その章ファイルのあるディレクトリ」基準（入れ子でも同じ）
#   - chapters に並べたファイルの先頭見出しは h1（章）に昇格される。
#     長い章を分割するときは章ファイルを1つ立て、そこから include すること。
#   - 画像はプロジェクトルート基準の /diagrams/... で書く（../ は Windows で
#     バックスラッシュ結合され typst 0.15 以降が拒否するため）
# ============================================================
project:
  type: book
  output-dir: _book

book:
  title: 受注管理システム 基本設計書
  subtitle: サンプル・ボイラープレート
  author: 設計チーム
  chapters:
    - index.qmd
    - chapters/01-overview/_chapter.qmd
    - chapters/02-design-policy.qmd
    - chapters/03-design-conditions.qmd
    - chapters/04-system/_chapter.qmd
    - chapters/05-requirements.qmd
    - chapters/06-functions/_chapter.qmd
    - chapters/07-performance.qmd
    - chapters/08-io-data/_chapter.qmd
    - chapters/09-screens/_chapter.qmd
    - chapters/10-files.qmd
    - chapters/11-database/_chapter.qmd
    - chapters/12-fault.qmd
    - chapters/13-evaluation.qmd

lang: ja
doc-number: SD-2026-001
doc-revision: ""       # 改訂記号（A〜Z / NC）。doc-number の末尾に結合して資料番号に表示。空=改訂記号なし
spec: false            # スペック様式（全ページ上部に表題欄）にするか。true でスペック様式
company-ja: ソフト開発株式会社   # スペック様式フッターの会社名（日本語）
company-en: Soft Development Co., Ltd.   # スペック様式フッターの会社名（英語）

toc: true
toc-title: 目 次
toc-depth: 3

format:
  typst:
    # partials / filter は ../template/ を直接参照できる（Quarto が render 時に
    # 取り込む）。ただし lib.typ だけは typst のコンパイル時 import で
    # 「プロジェクト外は読めない」制約に掛かるため、ビルドスクリプトが
    # このフォルダ直下へ一時コピー（lib.typ）してから render する。
    template-partials:
      - ../template/typst-template.typ
      - ../template/typst-show.typ
  # 社内レビュー用 HTML。章ごとに別ページ・共通アセットは site_libs/ に1回だけ。
  # 全文検索（search.json）も自動で付く。
  html:
    number-sections: true
    # css はローカル参照にしておく（Quarto が _book/ に取り込み、単体で配信・zip
    # できるようにするため）。実体は ../template/design-doc.css で、ビルドが
    # このフォルダ直下へ一時コピーしてから render する。
    css: design-doc.css
    embed-resources: false
    # 画面幅の基準を 1920px にする（Quarto 既定は sidebar 250 + body 800 +
    # margin 250 ≒ 1280px）。左ペインは「章番号 + 見出し15文字」が折り返さずに
    # 収まる幅。合計 300 + 1380 + 240 = 1920px。
    grid:
      sidebar-width: 300px
      body-width: 1380px
      margin-width: 240px

filters:
  - ../template/design-doc.lua
