# ============================================================
#  設計書テンプレート 利用マニュアル（Quarto → PDF / HTML）
#
#  本テンプレート自身の使い方を、本テンプレートで書いた文書。
#  構成の規約は docs/ のサンプルと同じ（1ファイル = 1章、章の中は include で分割）。
#  様式・変換・ビルドの実体はリポジトリ直下の ../template/ にある。
#
#  ビルドはリポジトリのルートから:
#    .\template\build-qmd.bat manual     … PDF  → manual\design-doc.pdf
#    .\template\build-html.bat manual    … HTML → manual\_book\index.html
# ============================================================
project:
  type: book
  output-dir: _book

book:
  title: 設計書テンプレート 利用マニュアル
  subtitle: Markdown で書いて PDF にする
  author: テンプレート保守チーム
  chapters:
    - index.qmd
    - chapters/01-overview/index.qmd
    - chapters/02-setup-common/index.qmd
    - chapters/03-author-env/index.qmd
    - chapters/04-authoring-doc/index.qmd
    - chapters/05-review/index.qmd
    - chapters/06-markdown/index.qmd
    - chapters/07-structure/index.qmd
    - chapters/08-figure/index.qmd
    - chapters/09-table/index.qmd
    - chapters/10-ipo/index.qmd
    - chapters/11-publisher-env/index.qmd
    - chapters/12-build/index.qmd
    - chapters/13-trouble/index.qmd
    - chapters/14-limitations/index.qmd
    - chapters/15-cheatsheet/index.qmd
    - chapters/16-repository/index.qmd
    - chapters/17-maintainer/index.qmd

lang: ja
doc-number: MAN-2026-001
doc-revision: ""       # 改訂記号（A〜Z / NC）。doc-number の末尾に結合。空=改訂記号なし
spec: false            # スペック様式（全ページ上部に表題欄）にするか
company-ja: ソフト開発株式会社
company-en: Soft Development Co., Ltd.

toc: true
toc-location: left
toc-title: 目 次
toc-depth: 3

format:
  typst:
    template-partials:
      - ../template/typst-template.typ
      - ../template/typst-show.typ
  html:
    number-sections: true
    css: design-doc.css
    embed-resources: false
    grid:
      sidebar-width: 300px
      body-width: 1560px
      margin-width: 60px

filters:
  - ../template/design-doc.lua
